services:
  postgres:
    image: postgres:18
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - bookstore-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U bookstore -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bookstore-pgdata:
